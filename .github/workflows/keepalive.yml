name: Не давать базе уснуть

# Бесплатный проект Supabase засыпает после недели без запросов. Раз в день открываем каталог.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/api/catalog" -o /dev/null
