name: Публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  backend:
    name: База и бот (Supabase)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Подключить проект
        run: supabase link --project-ref "$REF" -p "$SUPABASE_DB_PASSWORD"
      - name: Обновить базу
        run: supabase db push --remote --include-all --yes -p "$SUPABASE_DB_PASSWORD"
      - name: Секреты функции
        run: |
          supabase secrets set --project-ref "$REF" --yes \
            BOT_TOKEN="${{ secrets.BOT_TOKEN }}" \
            ADMIN_IDS="${{ secrets.ADMIN_IDS }}" \
            SETUP_KEY="${{ secrets.SETUP_KEY }}" \
            WEBHOOK_SECRET="${{ secrets.SETUP_KEY }}" \
            WEBAPP_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            supabase secrets set --project-ref "$REF" --yes GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
          fi
      - name: Опубликовать функцию
        run: supabase functions deploy api --project-ref "$REF" --no-verify-jwt --yes
      - name: Подключить бота (вебхук и кнопка «Каталог»)
        run: |
          curl -fsS -X POST "https://$REF.supabase.co/functions/v1/api/setup?key=${{ secrets.SETUP_KEY }}"

  web:
    name: Мини-апп (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Адрес сервера
        run: |
          REF="${{ secrets.SUPABASE_PROJECT_REF }}"
          cat > web/config.js <<JS
          window.LOOKSY_API = "https://$REF.supabase.co/functions/v1";
          window.LOOKSY_FILES = "https://$REF.supabase.co/storage/v1/object/public/uploads/";
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: pages
        uses: actions/deploy-pages@v4
