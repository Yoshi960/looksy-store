<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>LOOKSY STORE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Бутик LOOKSY: тема как в Telegram у покупателя. Светлая — тёплый снег и мокко, тёмная — графит и карамель. Цены и заголовки — Unbounded. */
:root{
  --bg:#F6F5F3; --surface:#FFFFFF; --surface2:#ECEAE6; --line:rgba(20,18,16,.09);
  --text:#151416; --text2:#4A4744; --hint:#7A7671; --accent:#7A4E33; --accent-ink:#FFFFFF; --accent-soft:#F1E6DC;
  --sale:#D9483B; --scrim:rgba(21,20,22,.55); --glass:rgba(246,245,243,.9);
  --st-new-bg:#FFF1C9; --st-new:#6B4E00; --st-paid-bg:#DDF4E3; --st-paid:#1C5E33; --st-sent-bg:#DCEBFB; --st-sent:#164A7A; --st-cancel-bg:#FBE1E0; --st-cancel:#7A1E1A;
  --display:"Unbounded","Arial Black",sans-serif; --body:"Manrope",-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E0E10; --surface:#17171A; --surface2:#222226; --line:rgba(255,255,255,.08);
  --text:#F2F0ED; --text2:#CFCCC8; --hint:#8E8B87; --accent:#C9A27E; --accent-ink:#1B130D; --accent-soft:#2A221B;
  --sale:#E5574A; --scrim:rgba(14,14,16,.62); --glass:rgba(14,14,16,.9);
  --st-new-bg:#4A3B1A; --st-new:#F5D98A; --st-paid-bg:#173A23; --st-paid:#8FE0A8; --st-sent-bg:#16304A; --st-sent:#93C5F5; --st-cancel-bg:#45191A; --st-cancel:#F2A3A0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E10; --surface:#17171A; --surface2:#222226; --line:rgba(255,255,255,.08);
  --text:#F2F0ED; --text2:#CFCCC8; --hint:#8E8B87; --accent:#C9A27E; --accent-ink:#1B130D; --accent-soft:#2A221B;
  --sale:#E5574A; --scrim:rgba(14,14,16,.62); --glass:rgba(14,14,16,.9);
  --st-new-bg:#4A3B1A; --st-new:#F5D98A; --st-paid-bg:#173A23; --st-paid:#8FE0A8; --st-sent-bg:#16304A; --st-sent:#93C5F5; --st-cancel-bg:#45191A; --st-cancel:#F2A3A0;
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--body);transition:background .2s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:640px;margin:0 auto;padding-block:10px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* шапка */
.top{display:flex;align-items:center;gap:10px;padding:6px 0 14px}
.logo{display:flex;align-items:center;font:900 20px/1 var(--display);letter-spacing:-.01em;flex:1}
.eyes{display:inline-flex;gap:3px;margin:0 2px}
.eye{width:17px;height:17px;border-radius:50%;border:4px solid var(--accent);display:flex;align-items:center;justify-content:flex-end;padding-right:1px}
.eye::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--text)}
.logo small{font:600 9px var(--display);letter-spacing:.45em;color:var(--hint);margin-left:10px}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text);position:relative;flex:none}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 6px 0 12px;height:46px;margin-bottom:14px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--text)}

/* разделы */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface2);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{border:0;background:none;border-radius:11px;padding:10px 0;color:var(--hint);font-weight:700}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* выбор недели */
.hero-h{display:flex;align-items:baseline;justify-content:space-between;margin:2px 0 10px}
.hero-h h2{margin:0;font:800 17px var(--display)}
.hero{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px 22px;padding:0 16px}
.hero::-webkit-scrollbar{display:none}
.hcard{flex:none;width:76%;max-width:300px;scroll-snap-align:start;border:0;padding:0;background:none;color:#fff;text-align:left;position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/5}
.hcard img{width:100%;height:100%;object-fit:cover;display:block}
.hcard .ov{position:absolute;inset:auto 0 0 0;padding:40px 16px 16px;background:linear-gradient(transparent,rgba(0,0,0,.72));display:flex;flex-direction:column;gap:4px}
.hcard .ov b{font:800 18px var(--display)}
.hcard .ov span{font-size:13px;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* категории */
.cats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 18px;padding:0 16px}
.cats::-webkit-scrollbar{display:none}
.tile{flex:none;width:92px;border:0;background:none;padding:0;text-align:left;color:var(--text)}
.tile .im{width:92px;height:112px;border-radius:16px;background:var(--surface2);overflow:hidden;border:2px solid transparent}
.tile.on .im{border-color:var(--accent)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .all{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font:800 13px var(--display);color:var(--accent);background:var(--accent-soft)}
.tile span{display:block;font-size:12px;font-weight:600;margin-top:6px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile em{font-style:normal;color:var(--hint);font-weight:500}

/* панель над сеткой */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.bar h2{margin:0;font:800 17px var(--display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .cnt{color:var(--hint);font-size:13px;font-weight:500;margin-left:6px;font-family:var(--body)}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-weight:700;font-size:13px;flex:none}
.pill b{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 6px;font-size:11px}

/* сетка */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
.card{position:relative;min-width:0}
.card .open{display:block;width:100%;border:0;background:none;padding:0;text-align:left;color:var(--text)}
.heart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--glass);color:var(--text);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.heart .ico{width:18px;height:18px}
.heart.on .ico,.iconbtn.on .ico{fill:var(--sale);stroke:var(--sale)}
.heart.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25)}}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--sale);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--text2)}
.rate b{display:inline-flex;align-items:center;gap:4px;color:var(--text)}
.star{width:14px;height:14px;fill:#E6A23C;stroke:none}
.mrate{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--hint);margin-top:2px}
.fitbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:4px}
.fitbar div{background:var(--surface);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--hint)}
.fitbar div b{display:block;font:800 16px var(--display);color:var(--text);font-variant-numeric:tabular-nums}
.fitbar div.top{outline:2px solid var(--accent)}
.rev{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.rev .h{display:flex;justify-content:space-between;gap:10px;align-items:center}
.rev .stars{display:flex;gap:2px}
.rev .pics{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.rev .pics img{width:72px;height:96px;border-radius:10px;object-fit:cover;flex:none}
.rev p{margin:0;color:var(--text2);line-height:1.5;white-space:pre-wrap}
.fitlbl{font-size:12px;color:var(--accent);font-weight:700}
.starpick{display:flex;gap:6px;justify-content:center;margin:6px 0 18px}
.starpick button{border:0;background:none;padding:4px}
.starpick .star{width:40px;height:40px;fill:var(--surface2)}
.starpick button.on .star{fill:#E6A23C}
.ph{aspect-ratio:3/4;border-radius:var(--r);background:var(--surface2);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:active .ph img{transform:scale(.98)}
.tags{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tag{border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800;letter-spacing:.02em}
.tag.sale{background:var(--sale);color:#fff}
.tag.hit{background:var(--accent);color:var(--accent-ink)}
.tag.fast{background:#fff;color:#151416}
.out{position:absolute;inset:0;background:var(--scrim);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.price{font:800 15px var(--display);margin-top:9px;font-variant-numeric:tabular-nums}
.old{color:var(--hint);text-decoration:line-through;font:500 12px var(--body);margin-left:6px}
.ttl{font-size:13px;color:var(--text2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.empty{color:var(--hint);text-align:center;padding:56px 0}
.empty b{display:block;color:var(--text);font:800 16px var(--display);margin-bottom:6px}
.sk{background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}

/* нижний лист */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:20;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:24px 24px 0 0;max-height:86vh;overflow-y:auto;
  padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .25s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--surface2);margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font:800 18px var(--display)}
.sec{color:var(--hint);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:18px 0 10px}
.clist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.citem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:8px;text-align:left;color:var(--text);min-width:0}
.citem img,.citem i{width:40px;height:50px;border-radius:10px;object-fit:cover;background:var(--surface2);flex:none}
.citem span{font-weight:700;font-size:13px;line-height:1.25;min-width:0;overflow:hidden;text-overflow:ellipsis}
.citem em{display:block;font-style:normal;color:var(--hint);font-weight:500;font-size:12px}
.citem.on{border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.heart.pop{animation:none}}
.sizes{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.sizes th,.sizes td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}
.sizes th{color:var(--hint);font-weight:600;font-size:12px}
.sizes td:first-child{font-weight:800;text-align:left}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* выбор */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-width:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;color:var(--text)}
.opt.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:16px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px}
.btn.ghost{background:var(--surface2);color:var(--text)}
.btn.danger{background:transparent;color:var(--sale);border:1px solid var(--sale)}
.btn:disabled{opacity:.45}
.textbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0;font-size:13px}

/* товар */
.gal{position:relative;margin:-10px -16px 0}
.gal{overflow:hidden}
.gal .track{display:flex;touch-action:pan-y;transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform}
.gal .track.drag{transition:none}
.gal img{flex:none;width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--surface2);display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.gal .dots{position:absolute;left:0;right:0;bottom:36px;display:flex;justify-content:center;gap:6px;pointer-events:none}
.gal .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);transition:width .2s}
.gal .dots i.on{width:18px;border-radius:3px;background:#fff}
@media (prefers-reduced-motion:reduce){.gal .track{transition:none}}
.gal .count{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));background:var(--scrim);color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.gal .tl{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px))}
.gal .tr{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px))}
.gal .iconbtn{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.info{position:relative;background:var(--bg);border-radius:24px 24px 0 0;margin:-24px -16px 0;padding:22px 16px 0}
.info .badges{display:flex;gap:6px;margin-bottom:10px}
.info .badges .tag{font-size:12px}
.info h1{margin:0;font:800 22px/1.2 var(--display);text-wrap:balance}
.lbl{display:flex;justify-content:space-between;align-items:center;color:var(--hint);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:22px 0 10px}
.lbl span{letter-spacing:0;text-transform:none;font-weight:600;color:var(--text)}
.desc{white-space:pre-wrap;color:var(--text2);margin:0;line-height:1.55}
.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:22px}
.perk{background:var(--surface);border-radius:14px;padding:12px 10px;font-size:12px;color:var(--text2);line-height:1.3;display:flex;flex-direction:column;gap:6px}
.perk .ico{color:var(--accent)}
.perk b{color:var(--text);font-size:13px}
.similar{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.similar::-webkit-scrollbar{display:none}
.similar .card{flex:none;width:132px}
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.buybar .in{max-width:608px;margin:0 auto;display:flex;align-items:center;gap:14px}
.buybar .p{font:800 20px var(--display);white-space:nowrap}
.buybar .p .old{display:block;margin:0;font-size:12px}
.buybar .btn{flex:1}

/* формы */
.field{margin-bottom:14px}
.field label{display:flex;justify-content:space-between;color:var(--hint);font-size:13px;margin-bottom:6px}
.field label i{font-style:normal;opacity:.8}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--surface);outline:none;color:var(--text)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:76px;resize:vertical}
h1.page{font:800 22px var(--display);margin:8px 0 16px}
.mini{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px;margin-bottom:18px}
.mini img{width:56px;height:72px;border-radius:10px;object-fit:cover;background:var(--surface2)}
.mini .g{flex:1;min-width:0}
.hintbox{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--text2);margin:-4px 0 14px}
.hintbox .ico{color:var(--accent)}
.muted{color:var(--hint);font-size:13px}
.ok{text-align:center;padding:56px 0}
.ok .ring{width:72px;height:72px;border-radius:50%;border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:var(--accent)}
.ok .ring .ico{width:32px;height:32px}
.linkback{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--hint);padding:6px 0;font-weight:600}

/* админка */
.atabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px}
.atabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;color:var(--hint)}
.atabs button.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.lrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left;color:var(--text)}
.lrow img,.lrow i{width:48px;height:62px;border-radius:10px;object-fit:cover;background:var(--surface2);flex:none}
.lrow .g{flex:1;min-width:0}
.lrow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.mtag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:800;background:var(--accent-soft);color:var(--accent);margin-left:4px}
.good{color:var(--st-paid)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.thumb{position:relative;width:84px;display:flex;flex-direction:column;gap:4px}
.thumb img{width:84px;height:112px;object-fit:cover;border-radius:10px;display:block}
.thumb .main{position:absolute;left:4px;top:4px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px}
.thumb .mv{display:flex;gap:4px}
.thumb .mv button{position:static;flex:1;width:auto;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:13px;font-weight:700;padding:0}
.thumb .mv button:disabled{opacity:.3}
.thumb>button{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--sale);color:#fff;line-height:1}
.file{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--hint);border-radius:14px;padding:14px;color:var(--hint);font-weight:600;cursor:pointer}
.file input{display:none}
.check{display:flex;align-items:center;gap:10px;font-weight:600;margin:6px 0 16px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.ai{background:var(--accent-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:14px}

<body>
<div class="wrap" id="app"></div>
<div id="sheet"></div>
<script>
const tg = window.Telegram?.WebApp?.initData !== undefined && window.Telegram?.WebApp?.platform !== 'unknown' ? window.Telegram.WebApp : null;
const qs = new URLSearchParams(location.search);
const START = tg?.initDataUnsafe?.start_param || '';
const SOURCE = (qs.get('src') || START || 'direct').slice(0,40);
const GROUPS = [['w','Женщинам'],['m','Мужчинам']];
const PROMO = {hit:['Хит','В блок «Выбор недели» и в начало каталога'], fast:['Быстро продать','Плашка «Успей» и в начало каталога'], margin:['Высокая маржа','В начало каталога, покупатель причину не видит'], '':['Обычный','Без продвижения']};
const RANK = {hit:0, fast:1, margin:2, top:2};
const S = {shop:'LOOKSY STORE', bot:'', admin:false, cats:[], products:[], grp:'w', cat:null, q:'', searching:false,
  f:{sort:'rec', sizes:[], max:'', stock:false}, view:'shop', tab:'products', favs:new Set()};
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub = n => (+n||0).toLocaleString('ru-RU') + ' ₽';
const API = (window.LOOKSY_API || '').replace(/\/$/, '');
const img = p => p ? (/^(https?:|blob:|data:)/.test(p) ? p : (window.LOOKSY_FILES || '/uploads/') + p) : '';
const I = {
  search:'<svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  filter:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  x:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  back:'<svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  share:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
  gear:'<svg class="ico" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg>',
  ruler:'<svg class="ico" viewBox="0 0 24 24"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg>',
  check:'<svg class="ico" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>',
  plus:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  photo:'<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3.5"/></svg>',
  chat:'<svg class="ico" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  truck:'<svg class="ico" viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  heart:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 20s-7.2-4.5-9.2-9.1A5.1 5.1 0 0 1 12 6.1a5.1 5.1 0 0 1 9.2 4.8C19.2 15.5 12 20 12 20z"/></svg>',
  bag:'<svg class="ico" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  grid:'<svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>',
  box:'<svg class="ico" viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>',
  copy:'<svg class="ico" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  shield:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.4 3 7.8 7 9 4-1.2 7-4.6 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg>',
};
const STAR = '<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>';
const FIT = {small:'Маломерит', ok:'В размер', big:'Большемерит'};
const plural = (n,a,b,c) => { const m=n%10, h=n%100; return n+' '+(m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c); };
const LOGO = `<div class="logo">L<span class="eyes"><i class="eye"></i><i class="eye"></i></span>KSY<small>STORE</small></div>`;

// ---------- тема как в Telegram
function applyTheme() {
  const root = document.documentElement;
  let dark;
  if (tg) dark = tg.colorScheme === 'dark';
  else if (root.dataset.theme && !root.dataset.auto) return;   // тема уже выбрана снаружи
  else { dark = matchMedia('(prefers-color-scheme: dark)').matches; root.dataset.auto = '1'; }
  root.dataset.theme = dark ? 'dark' : 'light';
  const bg = getComputedStyle(root).getPropertyValue('--bg').trim();
  try { tg?.setHeaderColor?.(bg); tg?.setBackgroundColor?.(bg); tg?.setBottomBarColor?.(bg); } catch(e){}
}
try { tg?.ready(); tg?.expand(); tg?.onEvent?.('themeChanged', applyTheme); } catch(e){}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!tg) applyTheme(); });
applyTheme();

async function api(path, opt={}) {
  opt.headers = Object.assign({'X-Init-Data': tg?.initData || ''}, opt.headers||{});
  if (opt.json) { opt.body = JSON.stringify(opt.json); opt.headers['Content-Type']='application/json'; }
  const r = await fetch(API + path, opt);
  if (!r.ok) throw new Error(await r.text() || r.status);
  return r.json();
}
const track = (type, product_id) => api('/api/event', {method:'POST', json:{type, product_id, source:SOURCE}}).catch(()=>{});
function toast(t){ $$('.toast').forEach(x=>x.remove()); const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.append(d); setTimeout(()=>d.remove(),2400); }
function haptic(k='light'){ try{ tg?.HapticFeedback?.impactOccurred?.(k); }catch(e){} }
let armed=null;
function confirmTap(key, text){ if(armed===key){armed=null;return true;} armed=key; toast(text+' Нажмите ещё раз для подтверждения'); setTimeout(()=>{ if(armed===key) armed=null; },3000); return false; }
function setBack(fn){ try{ tg?.BackButton?.offClick?.(window.__bk); if(fn){ window.__bk=fn; tg?.BackButton?.onClick(fn); tg?.BackButton?.show(); } else tg?.BackButton?.hide(); }catch(e){} }

async function load() {
  const [me, cat] = await Promise.all([api('/api/me'), api('/api/catalog')]);
  S.shop = me.shop; S.bot = me.bot || ''; S.admin = me.is_admin; S.ai = !!me.ai;
  S.cats = cat.categories.map(c=>({...c, grp:c.grp||'w'})); S.products = cat.products;
  try { S.favs = new Set(await api('/api/favs')); } catch(e) {}
}

// ---------- сжатие фото перед загрузкой (быстрее на мобильном интернете, меньше места в хранилище)
async function shrink(file, max=1280) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    return blob ? new File([blob], 'photo.jpg', {type:'image/jpeg'}) : file;
  } catch(e) { return file; }
}

// ---------- корзина (хранится в Telegram у покупателя, запасной вариант — в браузере)
const CART_KEY = 'looksy_cart';
async function cartLoad() {
  let v = null;
  try { if (tg?.CloudStorage) v = await new Promise(r => tg.CloudStorage.getItem(CART_KEY, (e, x) => r(e ? null : x))); } catch(e) {}
  if (!v) try { v = localStorage.getItem(CART_KEY); } catch(e) {}
  try { S.cart = (JSON.parse(v || '[]') || []).filter(i => S.products.some(p => p.id === i.pid)); } catch(e) { S.cart = []; }
}
function cartSave() {
  const v = JSON.stringify(S.cart);
  try { localStorage.setItem(CART_KEY, v); } catch(e) {}
  try { tg?.CloudStorage?.setItem(CART_KEY, v, () => {}); } catch(e) {}
  const n = cartCount(); $$('.cartcnt').forEach(b => { b.textContent = n; b.hidden = !n; });
}
const cartCount = () => S.cart.reduce((a, i) => a + i.qty, 0);
const cartLine = i => S.products.find(p => p.id === i.pid);
function cartAdd(p, sel) {
  const ex = S.cart.find(i => i.pid === p.id && i.size === (sel.size||'') && i.color === (sel.color||''));
  if (ex) ex.qty = Math.min(10, ex.qty + 1); else S.cart.push({pid:p.id, size:sel.size||'', color:sel.color||'', qty:1});
  cartSave();
}

// ---------- нижнее меню
function nav(active) {
  const fc = S.favs.size, cc = cartCount();
  return `<nav class="nav"><div class="in">
    <button data-nav="shop" class="${active==='shop'?'on':''}">${I.grid}Каталог</button>
    <button data-nav="favs" class="${active==='favs'?'on':''}">${I.heart}Избранное<span class="badge" id="favcnt" ${fc?'':'hidden'}>${fc}</span></button>
    <button data-nav="cart" class="${active==='cart'?'on':''}">${I.bag}Корзина<span class="badge cartcnt" ${cc?'':'hidden'}>${cc}</span></button>
    <button data-nav="orders" class="${active==='orders'?'on':''}">${I.box}Заказы</button></div></nav>`;
}
function bindNav() {
  $$('[data-nav]').forEach(b => b.onclick = () => { haptic(); window.scrollTo(0,0);
    ({shop:renderShop, favs:renderFavs, cart:renderCart, orders:renderOrders})[b.dataset.nav](); });
}

// ---------- избранное
async function toggleFav(id, btn) {
  const on = !S.favs.has(id);
  on ? S.favs.add(id) : S.favs.delete(id);
  $$(`[data-fav="${id}"]`).forEach(b => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  if (btn) { btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); }
  haptic(on ? 'medium' : 'light');
  const cnt = $('#favcnt'); if (cnt) { cnt.textContent = S.favs.size; cnt.hidden = !S.favs.size; }
  try {
    await api('/api/fav', {method:'POST', json:{product_id:id, on}});
    if (on) toast('В избранном. Напишем в Telegram, если подешевеет или снова появится');
  } catch(e) {
    on ? S.favs.delete(id) : S.favs.add(id);
    $$(`[data-fav="${id}"]`).forEach(b => b.classList.toggle('on', !on));
    toast('Избранное работает, когда магазин открыт в Telegram');
  }
}
function bindCards(root=document) {
  root.querySelectorAll('[data-fav]').forEach(b => b.onclick = e => { e.stopPropagation(); toggleFav(+b.dataset.fav, b); });
  root.querySelectorAll('.card .open, .hcard').forEach(b => b.onclick = () => openProduct(+b.dataset.id));
}
const heartBtn = (id, cls='heart') => `<button class="${cls} ${S.favs.has(id)?'on':''}" data-fav="${id}" aria-label="В избранное" aria-pressed="${S.favs.has(id)}">${I.heart}</button>`;
const miniRate = p => p.rating ? `<div class="mrate">${STAR}${p.rating.avg} · ${p.rating.n}</div>` : '';

// ---------------------------------------------------------------- витрина
const catOf = id => S.cats.find(c=>c.id===id);
const hasItems = c => S.products.some(p=>p.category_id===c.id);
const grpCats = () => S.cats.filter(c=>c.grp===S.grp && hasItems(c));
const inGrp = p => (catOf(p.category_id)?.grp || 'w') === S.grp;
const coverOf = cid => S.products.find(p=>p.category_id===cid && p.photos[0])?.photos[0];
const filtersOn = () => (S.f.sizes.length?1:0)+(S.f.max?1:0)+(S.f.stock?1:0)+(S.f.sort!=='rec'?1:0);
const rank = p => (p.in_stock ? 0 : 10) + (RANK[p.promo] ?? 5);

function list() {
  let l = S.products.filter(p => S.q ? p.title.toLowerCase().includes(S.q.toLowerCase()) : inGrp(p) && (!S.cat || p.category_id===S.cat));
  if (S.f.sizes.length) l = l.filter(p => p.sizes.some(s => S.f.sizes.includes(s)));
  if (S.f.max) l = l.filter(p => p.price <= +S.f.max);
  if (S.f.stock) l = l.filter(p => p.in_stock);
  if (S.f.sort==='rec') l = [...l].sort((a,b)=>rank(a)-rank(b));
  if (S.f.sort==='cheap') l = [...l].sort((a,b)=>a.price-b.price);
  if (S.f.sort==='exp') l = [...l].sort((a,b)=>b.price-a.price);
  return l;
}
function tags(p) {
  const t = [];
  if (p.promo==='hit') t.push('<span class="tag hit">ХИТ</span>');
  if (p.promo==='fast') t.push('<span class="tag fast">УСПЕЙ</span>');
  if (p.old_price > p.price) t.push(`<span class="tag sale">−${Math.round(100-p.price/p.old_price*100)}%</span>`);
  return t.join('');
}

function renderShop() {
  S.view='shop'; setBack(S.searching ? closeSearch : null);
  const cats = grpCats(), l = list(), fo = filtersOn();
  const hits = !S.q && !S.cat && !fo ? S.products.filter(p => p.promo==='hit' && p.in_stock && inGrp(p)) : [];
  const title = S.q ? 'Поиск' : (S.cat ? catOf(S.cat)?.name : 'Все вещи');
  $('#app').innerHTML = `
    <div class="top">${LOGO}

// Листание галереи строго по одному фото: короткий свайп — следующее, сильный — тоже только одно.
function gallery(trk, n) {
  if (!trk || n < 2) return;
  let idx = 0, x0 = 0, y0 = 0, dx = 0, t0 = 0, dir = null;
  const go = i => {
    idx = Math.max(0, Math.min(n - 1, i));
    trk.style.transform = `translateX(${-idx * 100}%)`;
    $('#cnt') && ($('#cnt').textContent = `${idx + 1} / ${n}`);
    $$('#dots i').forEach((d, k) => d.classList.toggle('on', k === idx));
  };
  trk.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; dir = null; t0 = Date.now(); }, {passive:true});
  trk.addEventListener('touchmove', e => {
    const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (!dir) dir = Math.abs(mx) > Math.abs(my) + 4 ? 'x' : (Math.abs(my) > 8 ? 'y' : null);
    if (dir !== 'x') return;
    dx = mx;
    const edge = (idx === 0 && dx > 0) || (idx === n - 1 && dx < 0) ? 0.3 : 1;  // упругий край
    trk.classList.add('drag');
    trk.style.transform = `translateX(calc(${-idx * 100}% + ${dx * edge}px))`;
  }, {passive:true});
  trk.addEventListener('touchend', () => {
    trk.classList.remove('drag');
    if (dir === 'x') {
      const fast = Math.abs(dx) > 25 && Date.now() - t0 < 250;
      if (Math.abs(dx) > trk.clientWidth * 0.18 || fast) { go(idx + (dx < 0 ? 1 : -1)); haptic(); } else go(idx);
    }
    dir = null; dx = 0;
  });
  // на компьютере — клик по левой/правой половине
  trk.parentElement.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    const r = trk.getBoundingClientRect();
    go(idx + (e.clientX - r.left > r.width / 2 ? 1 : -1));
  });
}

function fitTop(p) {

}

      fd.append('order_id', oid); fd.append('product_id', item.product_id); fd.append('rating', st.rating); fd.append('fit', st.fit||''); fd.append('text', $('#r_text').value);

      $('#r_send').disabled = true; $('#r_send').textContent = 'Отправляем…';
      try {
        await api('/api/review', {method:'POST', body:fd});
        setBack(null);
        $('#app').innerHTML = `<div class="ok"><div class="ring">${I.check}</div><h1 class="page">Спасибо за отзыв!</h1>
          <p class="muted">Он появится в карточке товара после проверки.</p><button class="btn ghost" id="home">${left.length>1?'Оценить другие вещи':'В каталог'}</button></div>`;
        $('#home').onclick = left.length>1 ? () => renderReview(oid) : renderShop;
      } catch(e) { toast('Не отправилось, попробуйте ещё раз'); $('#r_send').disabled=false; $('#r_send').textContent='Отправить отзыв'; }
    };
  };
  draw();
}

    <div class="field"><label for="f_comment">Комментарий <i>необязательно</i></label><textarea id="f_comment" placeholder="Любые пожелания или вопросы">${esc(st.comment||'')}</textarea></div>
    <p class="muted">Оплата — после того, как менеджер подтвердит наличие и детали доставки. Статус и трек-номер появятся в разделе «Заказы».</p>
    <div class="buybar"><div class="in"><div class="p">${rub(total)}</div><button class="btn" id="send">Отправить заказ</button></div></div>`;
  const stash = () => { st.name=$('#f_name').value; st.city=$('#f_city').value; st.comment=$('#f_comment').value; if($('#f_phone')) st.phone=$('#f_phone').value; };
  $('#bk') && ($('#bk').onclick = renderCart);

        ${files.map((f,i)=>`<div class="thumb"><img src="${URL.createObjectURL(f)}" alt="">${!keep.length&&i===0?'<span class="main">Обложка</span>':''}<button data-n="${i}" aria-label="Удалить фото">×</button></div>`).join('')}</div>

    ['newyear','Новогодние огни', `${MODEL_W}. Festive winter evening at a Christmas market: string lights, decorated fir branches, golden bokeh. She looks up at falling snowflakes with a joyful smile, hands in pockets. Cozy, magical, warm tones, 85mm.`],
    ['park','Зимний парк, солнце', `${MODEL_W}. Snowy park at golden hour, low sun behind her making the fur glow, sparkling snow in the air. She is twirling slightly, coat moving, happy and carefree. Dreamy backlight, 85mm, soft haze.`],
    ['close','Крупно: мех и детали', `${MODEL_W}, framed from the lips down to the waist — the face mostly out of frame. Her hand with a delicate ring gently touches the collar, showing how soft and thick the material is. Soft window light, rich texture in sharp focus, creamy background, macro-like detail, luxurious tactile mood.`],
    ['mirror','Селфи в зеркале', `${MODEL_W}. Mirror selfie in a stylish bright apartment hallway, phone covering most of her face, slight hip-pop pose, natural daylight from a window, cozy home details. Authentic Instagram look that feels like a real customer photo.`],
    ['studio','Студия · обложка', `${MODEL_W}. Fashion magazine cover shot in a minimal studio with a warm beige backdrop, confident power pose, one hand on the collar, dramatic soft key light with gentle shadow. Clean, premium, editorial.`],
    ['man','Мужское · город', `${MODEL_M}. Evening city street with wet asphalt reflecting neon and warm lights, light snow. He walks with hands in pockets, looking slightly off-camera, effortless cool. 50mm, cinematic grading.`],
  ];
  const ai = {preset:'evening', src: keep[0] || null, busy:false, extra:''};
  const aiScene = () => (AIP.find(x=>x[0]===ai.preset) || AIP[0])[2];
  function aiPrompt() {
    return `Create a scroll-stopping lifestyle photo for a clothing brand that makes people want to buy this item right now. ${aiScene()} ` +
      `The model wears the garment from the reference image — it is the hero of the frame. Keep the garment exactly identical: same color and shade, material, fur texture, collar, closures, pockets, belt, length, cut and proportions; do not add or remove details. ` +
      `Simple stylish outfit underneath that does not distract. Photorealistic, natural skin, realistic hands, vertical 3:4. No text, no logos, no watermarks, no brand names.` +
      (ai.extra ? ` Extra: ${ai.extra}` : '');
  }
  function aiBlock() {
    if (!keep.length) return '';
    return `<div class="ai"><h4>Нейро-фото на модели</h4>
      <div class="muted">Фото-основа</div>
      <div class="src">${keep.map(f=>`<button type="button" class="${ai.src===f?'on':''}" data-ais="${esc(f)}" aria-label="Взять это фото за основу"><img src="${img(f)}" alt=""></button>`).join('')}</div>
      <div class="muted">Сцена</div>
      <div class="opts">${AIP.map(([k,t])=>`<button type="button" class="opt ${ai.preset===k?'on':''}" data-aip="${k}">${t}</button>`).join('')}</div>
      <div class="field" style="margin:0"><label for="ai_extra">Свои пожелания <i>необязательно</i></label><input id="ai_extra" placeholder="Например: в руках бумажный пакет, рыжий кот рядом" value="${esc(ai.extra)}"></div>
      ${S.ai ? `<button type="button" class="btn" id="ai_go" ${ai.busy?'disabled':''}>${ai.busy?'Генерируем… ~20 секунд':'Сгенерировать фото'}</button>
        <span class="muted">Фото добавится в конец галереи. Сравните с оригиналом: цвет, мех, застёжки — если что-то не так, удалите и сгенерируйте ещё раз.</span>`
      : `<span class="muted">Ключ нейросети не подключён — можно сделать вручную: скопируйте промт, вставьте его вместе с фото-основой в Gemini и загрузите результат через «Добавить фото».</span>
        <pre id="ai_prompt">${esc(aiPrompt())}</pre><button type="button" class="btn ghost" id="ai_copy">Скопировать промт</button>`}
    </div>`;
  }
  function bindAi() {
    $$('[data-ais]').forEach(b => b.onclick = () => { stash(); ai.src = b.dataset.ais; draw(); });
    $$('[data-aip]').forEach(b => b.onclick = () => { stash(); ai.extra = $('#ai_extra')?.value || ''; ai.preset = b.dataset.aip; draw(); });
    $('#ai_extra') && ($('#ai_extra').oninput = e => { ai.extra = e.target.value; const pr = $('#ai_prompt'); if (pr) pr.textContent = aiPrompt(); });
    $('#ai_copy') && ($('#ai_copy').onclick = () => navigator.clipboard?.writeText(aiPrompt()).then(()=>toast('Промт скопирован'), ()=>toast('Выделите текст промта и скопируйте')));
    $('#ai_go') && ($('#ai_go').onclick = async () => {
      stash(); ai.extra = $('#ai_extra')?.value || ''; ai.busy = true; draw();
      try {
        const r = await api('/api/admin/ai-photo', {method:'POST', json:{product_id:p.id, photo:ai.src, prompt:aiPrompt()}});
        keep.push(r.name); p.photos = r.photos; toast('Готово — новое фото в конце галереи');
        const sp = S.products.find(x=>x.id===p.id); if (sp) sp.photos = r.photos;
      } catch(e) { toast(String(e.message||'Не получилось').slice(0,160)); }
      ai.busy = false; draw();
    });
  }

  async function save() {
    stash();
    if (!p.title.trim()) return toast('Введите название');
    if (!String(p.price).replace(/\D/g,'')) return toast('Введите цену');
    const fd = new FormData();
    fd.append('title', p.title); fd.append('category_id', p.category_id||''); fd.append('price', p.price);
    fd.append('old_price', p.old_price||''); fd.append('cost', p.cost||''); fd.append('promo', p.promo||'');
    fd.append('sizes', p.sizes.join(', ')); fd.append('colors', p.colors.join(', '));
    fd.append('description', p.description); fd.append('in_stock', p.in_stock?'1':'0'); fd.append('keep_photos', JSON.stringify(keep));
    $('#save').disabled = true; $('#save').textContent = 'Загружаем фото…';
    for (const f of files) { const x = await shrink(f); fd.append('photos', x, x.name); }
    $('#save').disabled = true; $('#save').textContent = 'Сохраняем…';
    try {
      const r = await api(isNew ? '/api/admin/product' : `/api/admin/product/${p.id}`, {method: isNew?'POST':'PUT', body: fd});
      await load(); toast(r.notified ? `Сохранено. Уведомили ${plural(r.notified,'покупателя','покупателей','покупателей')} из избранного` : 'Сохранено'); aProducts();
    } catch(e) { toast('Не сохранилось: ' + e.message); $('#save').disabled = false; $('#save').textContent = 'Сохранить'; }
  }
  async function del() {
    if (!confirmTap('del'+p.id, 'Удалить товар?')) return;
    await api(`/api/admin/product/${p.id}`, {method:'DELETE'}); await load(); toast('Товар удалён'); aProducts();
  }
  draw();
}

function aCats() {
  $('#pane').innerHTML = `
    <div class="field"><label for="c_new">Новая категория</label><input id="c_new" placeholder="Например: Шубы"></div>
    <div class="seg" id="c_grp">${GROUPS.map(([k,t],i)=>`<button data-cg="${k}" class="${i===0?'on':''}">${t}</button>`).join('')}</div>
    <button class="btn" id="c_add">${I.plus}Добавить категорию</button>
    ${GROUPS.map(([g,t])=>`<h2 class="sec2">${t}</h2>${S.cats.filter(c=>c.grp===g).map(c=>`<div class="lrow">
      <div class="g"><input class="cname" data-id="${c.id}" data-g="${c.grp}" value="${esc(c.name)}" aria-label="Название категории" style="border:0;background:none;width:100%;padding:4px 0;font-weight:600;color:var(--text);outline:none"></div>
      <span class="muted">${S.products.filter(p=>p.category_id===c.id).length} шт.</span>
      <button class="linkback" data-move="${c.id}" data-to="${g==='w'?'m':'w'}">→ ${g==='w'?'Муж.':'Жен.'}</button>
      <button class="linkback" data-del="${c.id}" style="color:var(--sale)">Удалить</button></div>`).join('') || '<div class="muted">Пока нет категорий</div>'}`).join('')}
    <p class="muted">Название можно исправить прямо в списке — сохранится, когда выйдете из поля. Пустые категории покупатели не видят.</p>`;
  let grp='w';
  $$('[data-cg]').forEach(b=>b.onclick=()=>{ grp=b.dataset.cg; $$('[data-cg]').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#c_add').onclick = async () => { const n=$('#c_new').value.trim(); if(!n) return toast('Введите название');
    await api('/api/admin/category',{method:'POST',json:{name:n,grp}}); await load(); toast('Категория добавлена'); aCats(); };
  $$('.cname').forEach(i => i.onchange = async () => {
    await api('/api/admin/category',{method:'POST',json:{id:+i.dataset.id,name:i.value,grp:i.dataset.g}}); await load(); toast('Сохранено'); });
  $$('[data-move]').forEach(b => b.onclick = async () => { const c=catOf(+b.dataset.move);
    await api('/api/admin/category',{method:'POST',json:{id:c.id,name:c.name,grp:b.dataset.to}}); await load(); aCats(); });
  $$('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirmTap('cat'+b.dataset.del, 'Удалить категорию? Товары останутся без категории.')) return;
    await api('/api/admin/category/'+b.dataset.del,{method:'DELETE'}); await load(); aCats(); });
}

const ST = {new:'Новый', paid:'Оплачен', sent:'Отправлен', arrived:'Прибыл', done:'Получен', cancel:'Отменён'};
async function aOrders() {
  const orders = await api('/api/admin/orders');
  const who = o => o.contact==='phone' ? `тел. <span style="user-select:all">${esc(o.phone)}</span>`
    : (o.username ? `<a href="https://t.me/${esc(o.username)}">@${esc(o.username)}</a>` : (o.user_id ? `<a href="tg://user?id=${o.user_id}">написать в Telegram</a>` : 'Telegram'));
  const items = o => (o.items && o.items.length ? o.items : [{title:o.product_title, price:o.price, qty:1, size:o.size, color:o.color}]);
  $('#pane').innerHTML = orders.length ? orders.map(o=>`<div class="ord">
      <div class="h"><b>#${o.id} · ${rub(o.price)}</b>
        <select data-o="${o.id}" class="st ${o.status}" aria-label="Статус заказа">${Object.entries(ST).map(([k,t])=>`<option value="${k}" ${o.status===k?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="oitems">${items(o).map(i=>`<span>• ${esc(i.title)}${i.qty>1?` × ${i.qty}`:''} <span class="muted">${[i.color, i.size&&'р. '+i.size].filter(Boolean).map(esc).join(' · ')} · ${rub(i.price*(i.qty||1))}</span></span>`).join('')}</div>
      ${o.cost!=null?`<div class="muted">Маржа: <span class="good">${rub(o.price-o.cost)}</span></div>`:''}
      <div>${esc(o.name)} · ${who(o)}</div>
      ${o.city||o.comment?`<div class="muted">${esc(o.city||'')}${o.comment?' · '+esc(o.comment):''}</div>`:''}
      <div class="orow" style="margin-top:6px"><select data-car="${o.id}" aria-label="Служба доставки">
          <option value="cdek" ${o.carrier==='cdek'||!o.carrier?'selected':''}>СДЭК</option><option value="post" ${o.carrier==='post'?'selected':''}>Почта России</option><option value="other" ${o.carrier==='other'?'selected':''}>Другое</option></select>
        <input data-tr="${o.id}" placeholder="Трек-номер" value="${esc(o.track||'')}" aria-label="Трек-номер"><button class="pill" data-trs="${o.id}">Сохранить</button></div>
      ${o.status==='arrived'?`<div class="muted">Напоминаний отправлено: ${o.reminders||0} из 2 (раз в 2 дня, в 11:17)</div>`:''}
      <div class="h"><span class="muted">${new Date(o.created_at*1000).toLocaleString('ru-RU')} · источник: ${esc(o.source)}</span>
        <button class="linkback" data-del="${o.id}" style="color:var(--sale);padding:0">Удалить</button></div></div>`).join('')
    : '<div class="empty"><b>Заказов пока нет</b>Новые заказы появятся здесь и придут вам в Telegram</div>';
  $$('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirmTap('ord'+b.dataset.del, 'Удалить заказ полностью? Он пропадёт и из статистики.')) return;
    await api('/api/admin/order/'+b.dataset.del, {method:'DELETE'}); toast('Заказ удалён'); aOrders(); });
  $$('[data-o]').forEach(s => s.onchange = async () => {
    const id = s.dataset.o, track = $(`[data-tr="${id}"]`).value.trim(), carrier = $(`[data-car="${id}"]`).value;
    if (s.value==='sent' && !track) toast('Совет: впишите трек-номер — покупатель получит его в сообщении');
    const r = await api(`/api/admin/order/${id}`,{method:'POST',json:{status:s.value, ...(track?{track, carrier}:{})}}); s.className='st '+s.value;
    toast(r.review_asked ? 'Статус обновлён, бот попросил отзыв' : r.notified ? 'Статус обновлён, покупатель получил сообщение' : 'Статус обновлён'); aOrders(); });
  $$('[data-trs]').forEach(b => b.onclick = async () => {
    const id = b.dataset.trs, track = $(`[data-tr="${id}"]`).value.trim(), carrier = $(`[data-car="${id}"]`).value;
    const r = await api(`/api/admin/order/${id}`,{method:'POST',json:{track, carrier}});
    toast(r.notified ? 'Трек сохранён и отправлен покупателю' : 'Трек сохранён. Покупатель получит его, когда поставите статус «Отправлен»'); });
}

const RS = {pending:'На проверке', ok:'Опубликован', hidden:'Скрыт'};
async function aReviews() {
  const list = await api('/api/admin/reviews');
  $('#pane').innerHTML = `<p class="muted" style="margin-top:0">Бот сам просит отзыв, когда вы ставите заказу статус «Получен». Отзыв появится у товара после того, как вы его опубликуете.</p>
    ${list.length ? list.map(v=>`<div class="rev">
      <div class="h"><b>${esc(v.product_title||'Товар удалён')}</b><span class="st ${v.status==='ok'?'paid':v.status==='pending'?'new':'cancel'}">${RS[v.status]}</span></div>
      <div class="h"><span>${esc(v.name)} · заказ #${v.order_id}</span><span class="stars">${STAR.repeat(v.rating)}</span></div>
      ${v.fit?`<span class="fitlbl">${FIT[v.fit]}</span>`:''}${v.text?`<p>${esc(v.text)}</p>`:''}
      ${JSON.parse(v.photos||'[]').length?`<div class="pics">${JSON.parse(v.photos).map(f=>`<img src="${img(f)}" alt="">`).join('')}</div>`:''}
      <div class="row2" style="margin-top:6px">${v.status!=='ok'?`<button class="btn" data-rv="${v.id}" data-s="ok" style="padding:11px">Опубликовать</button>`:`<button class="btn ghost" data-rv="${v.id}" data-s="hidden" style="padding:11px">Скрыть</button>`}
        <button class="btn danger" data-rv="${v.id}" data-s="delete" style="padding:11px">Удалить</button></div></div>`).join('')
    : '<div class="empty"><b>Отзывов пока нет</b>Они появятся после первых полученных заказов</div>'}`;
  $$('[data-rv]').forEach(b => b.onclick = async () => {
    if (b.dataset.s==='delete' && !confirmTap('rv'+b.dataset.rv, 'Удалить отзыв?')) return;
    await api('/api/admin/review/'+b.dataset.rv, {method:'POST', json:{status:b.dataset.s}});
    await load(); toast(b.dataset.s==='ok'?'Отзыв опубликован':b.dataset.s==='hidden'?'Отзыв скрыт':'Отзыв удалён'); aReviews();
  });
}

async function aStats(days=S.days||7) {
  S.days = days;
  const d = await api('/api/admin/stats?days='+days);
  const pct = (a,b) => b ? Math.round(a/b*1000)/10+'%' : '—';
  const SRC = {bot:'Бот /start', menu:'Кнопка «Каталог»', bot_msg:'Сообщения бота', share:'Ссылка «Поделиться»', direct:'Напрямую', admin:'Админ', tiktok:'TikTok', tgchannel:'Телеграм-канал', avito:'Авито', baraholka:'Барахолки', vk:'ВКонтакте'};
  $('#pane').innerHTML = `
    <div class="atabs">${[1,7,30].map(n=>`<button class="${days===n?'on':''}" data-d="${n}">${n===1?'Сегодня':n+' дней'}</button>`).join('')}</div>
    <div class="kpis">
      <div class="kpi"><span class="muted">Посетители</span><b>${d.visitors}</b><span class="muted">уникальные люди</span></div>
      <div class="kpi"><span class="muted">Заказы</span><b>${d.orders}</b><span class="muted">конверсия ${pct(d.orders, d.visitors)}</span></div>
      <div class="kpi"><span class="muted">Оплачено</span><b>${d.paid_orders} · ${rub(d.revenue)}</b>${d.paid_orders?`<span class="muted">средний чек ${rub(Math.round(d.revenue/d.paid_orders))}</span>`:''}</div>
      <div class="kpi"><span class="muted">Прибыль</span><b class="good">${rub(d.profit)}</b>${d.no_cost?`<span class="muted">без ${d.no_cost} зак. — нет закупки</span>`:''}</div>
    </div>
    <p class="muted" style="margin-top:-6px">Отменённые заказы не считаются. Тестовый заказ удалите во вкладке «Заказы» — он пропадёт отсюда.</p>
    <h2 class="sec2">Откуда приходят</h2>
    <div class="tbl"><table class="t"><tr><th>Источник</th><th class="n">Люди</th><th class="n">В корзину</th><th class="n">Заказы</th></tr>
    ${d.by_source.map(s=>`<tr><td>${esc(SRC[s.source]||s.source)}</td><td class="n">${s.visitors||0}</td><td class="n">${s.clicks||0}</td><td class="n">${s.orders||0}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Пока нет данных</td></tr>'}</table></div>
    <h2 class="sec2">Товары</h2>
    <div class="tbl"><table class="t"><tr><th>Товар</th><th class="n">Просм.</th><th class="n">В корз.</th><th class="n">Продано</th></tr>
    ${d.by_product.map(p=>`<tr><td>${esc(p.title)}</td><td class="n">${p.views||0}</td><td class="n">${p.clicks||0}</td><td class="n">${p.sold||0}</td></tr>`).join('')}</table></div>
    <h2 class="sec2">Ссылки для каналов</h2>
    <p class="muted">У каждого канала своя ссылка — так видно, откуда пришли люди.</p>
    ${['tiktok','tgchannel','avito','baraholka','vk'].map(s=>`<div class="code">t.me/${esc(S.bot||'ВАШ_БОТ')}?start=${s}</div>`).join('')}`;
  $$('[data-d]').forEach(b => b.onclick = () => aStats(+b.dataset.d));
}

// ---------------------------------------------------------------- старт
(async () => {
  skeleton();
  try { await load(); await cartLoad(); } catch(e) { $('#app').innerHTML = '<div class="empty"><b>Каталог не загрузился</b>Проверьте интернет и откройте ещё раз</div>'; return; }
  track('open');
  const rid = +(qs.get('review') || (START.startsWith('r_') ? START.slice(2) : 0));
  if (rid) return renderReview(rid);
  if (qs.get('view') === 'orders') return renderOrders();
  const pid = +(qs.get('p') || (START.startsWith('p_') ? START.slice(2) : 0));
  const pr = pid && S.products.find(x=>x.id===pid);
  if (pr) { S.grp = catOf(pr.category_id)?.grp || 'w'; openProduct(pid); } else renderShop();
})();
</script>
